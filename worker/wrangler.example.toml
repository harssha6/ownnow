# ownnow edge (OPTIONAL Cloudflare serving path) — serves sites from R2
# at {slug}.<your-domain> with zero egress fees. Requires your domain's
# zone to be on Cloudflare. Copy to wrangler.toml, edit, deploy:
#   cd worker && bun install
#   bunx wrangler r2 bucket create ownnow
#   bun run deploy
name = "ownnow"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Wildcard: every {slug}.example.com hits this Worker. Your apex/www
# records are separate and unaffected.
routes = [{ pattern = "*.example.com", zone_name = "example.com" }]

[vars]
BASE_DOMAIN = "example.com"

[[r2_buckets]]
binding = "SITES"
bucket_name = "ownnow"

# To count Worker traffic (including cache hits), keep the Go server running
# against this R2 bucket. Add these to [vars] above, not to [[r2_buckets]]:
# STATS_ORIGIN = "https://control.example.com"
# COUNTING = "true"
# ANALYTICS = '{"provider":"umami","scriptUrl":"https://metrics.example/script.js","websiteId":"YOUR-ID"}'
# Set secrets separately (never commit them):
#   bunx wrangler secret put STATS_KEY     # Go OWNNOW_EDGE_STATS_KEY
#   bunx wrangler secret put STATS_SECRET  # Go OWNNOW_SECRET
